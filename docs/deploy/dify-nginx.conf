# Dify Nginx 反向代理配置
# 保存到 /etc/nginx/conf.d/dify.conf
#
# 使用方法：
#   1. 安装 Nginx：sudo yum install -y nginx
#   2. 复制配置：sudo cp dify.conf /etc/nginx/conf.d/
#   3. 修改 example.com 为你的域名
#   4. 申请 SSL 证书（Let's Encrypt）：
#      sudo yum install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d your-domain.com
#   5. 启动：sudo systemctl enable --now nginx

upstream dify_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream dify_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;  # ⚠️ 修改为你的域名或 EC2 公网 IP

    # 强制跳转到 HTTPS（SSL 证书配置好后取消注释）
    # return 301 https://$server_name$request_uri;
}

